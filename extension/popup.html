<!doctype html>
<html>
  <head>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 300px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
      }
      h3 { font-size: 15px; margin-bottom: 14px; }
      .conn {
        font-size: 12px; margin-bottom: 12px; padding: 6px 8px;
        border-radius: 4px; background: #f5f5f5;
      }
      .conn.ok    { color: #2e7d32; background: #e8f5e9; }
      .conn.fail  { color: #c62828; background: #ffebee; }
      .field { margin-bottom: 10px; }
      label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
      input {
        width: 100%; padding: 7px 8px;
        border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
      }
      button {
        width: 100%; padding: 10px; border: none; border-radius: 6px;
        font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
      }
      .start { background: #1a73e8; }
      .start:hover { background: #1557b0; }
      .stop  { background: #d32f2f; }
      .stop:hover  { background: #b71c1c; }
      button:disabled { background: #bbb; cursor: default; }
      .status { text-align: center; margin-top: 8px; font-size: 12px; color: #666; }
      .status.recording { color: #d32f2f; font-weight: 600; }
      .status.uploading  { color: #e65100; }
      .status.error { color: #d32f2f; }
      .toggle { font-size: 12px; color: #1a73e8; cursor: pointer; text-align: right; margin: 12px 0 6px; }
      .config { display: none; }
      .config.show { display: block; }
      .save { margin-top: 6px; font-size: 13px; padding: 7px; }
      #mic { display: none; margin-top: 8px; }
      #mic.show { display: block; }
    </style>
  </head>
  <body>
    <h3>Shelby Meeting Capture</h3>
    <div id="conn" class="conn">Connecting...</div>

    <button id="btn" class="start" disabled>Start Recording</button>
    <div id="status" class="status"></div>
    <button id="mic" class="start">Allow microphone</button>

    <div class="toggle" id="toggle">Settings</div>
    <div class="config" id="config">
      <div class="field">
        <label>Shelby URL (the web app)</label>
        <input id="url" type="text" placeholder="http://127.0.0.1:8751">
      </div>
      <button class="start save" id="save">Save</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
